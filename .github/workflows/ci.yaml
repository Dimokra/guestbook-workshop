name: CI

on:
    push:
    pull_request:
jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Uv downloading
              uses: astral-sh/setup-uv@v6
            - name: install dependencies    
              run: uv sync
            - name: Linter (ruff)
              run: uv run ruff check .
            - name: Tests (pytest)
              run: uv run pytest
              env:
                GREETING: 'hici'
                DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
                DB_PASSWORD: 'ci'


    publish:
      needs: check
      if: github.ref == 'refs/heads/main'
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write
      steps: 
        - uses: actions/checkout@v5
        - name: Setting up builder docker
          uses: docker/setup-buildx-action@v4
        - name: setlowercase image name
          run: echo "IMAGE_URL=ghcr.io/$(echo '${{github.repository}}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
        - name: Enter to registry GHCR
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{github.actor}}
            password: ${{secrets.GITHUB_TOKEN}}
        - name: Build and publish image
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: ${{ env.IMAGE_URL }}:latest
          
    release:
      needs: check
      if: startsWith(github.ref, 'refs/tags/v')
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write
      steps:
        - uses: actions/checkout@v5
        - uses: docker/setup-buildx-action@v4
        - name: setlowercase image name
          run: echo "IMAGE_URL=ghcr.io/$(echo '${{github.repository}}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
        - uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{github.actor}}
            password: ${{secrets.GITHUB_TOKEN}}
        - uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: ${{ env.IMAGE_URL }}:${{ github.ref_name }}